# Deploys the plugin to the staging site on Kinsta after every merge into develop.
# Same build as the E2E tests and a release (tests/e2e/bin/build-plugin.sh), uploaded over SSH.
# Setup (secrets, SSH key): README.md, "Deployment to staging".
name: Deploy to staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://playgroundria.kinsta.cloud
    env:
      SSH_HOST: ${{ secrets.KINSTA_SSH_HOST }}
      SSH_PORT: ${{ secrets.KINSTA_SSH_PORT }}
      SSH_USER: ${{ secrets.KINSTA_SSH_USER }}
      # The site's public folder, e.g. /www/playgroundria_123/public
      SITE_PATH: ${{ secrets.KINSTA_SITE_PATH }}
      PLUGIN_DIR: wc-planzer-shipping
    steps:
      - uses: actions/checkout@v4

      - name: Build the plugin
        run: tests/e2e/bin/build-plugin.sh

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.KINSTA_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload next to the live plugin
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            tests/e2e/.build/wc-planzer-shipping/ \
            "$SSH_USER@$SSH_HOST:$SITE_PATH/wp-content/plugins/$PLUGIN_DIR.new/"

      # Swap the folders in one step, so the site never runs a half-uploaded plugin.
      - name: Switch, check and clear caches
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$SITE_PATH" "$PLUGIN_DIR" <<'REMOTE'
          set -euo pipefail
          site="$1"; dir="$2"
          cd "$site/wp-content/plugins"
          rm -rf "$dir.old"
          if [ -d "$dir" ]; then mv "$dir" "$dir.old"; fi
          mv "$dir.new" "$dir"
          rm -rf "$dir.old"
          cd "$site"
          wp plugin is-active "$dir" || wp plugin activate "$dir"
          echo "Version: $(wp plugin get "$dir" --field=version)"
          wp cache flush
          wp kinsta cache purge --all || echo "Kinsta cache purge not available"
          REMOTE

      - name: Summary
        run: |
          {
            echo "### Deployed to staging"
            echo "Commit \`${GITHUB_SHA::7}\` → https://playgroundria.kinsta.cloud"
          } >> "$GITHUB_STEP_SUMMARY"
